<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-ScaleX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="nav">
            <div class="logo">
                <img 
                src="logo.png"
                alt="logo">
            </div>
            <div class="middle-part">
                 <button class="btn">Home</button>
                    <button class="btn">About Us</button>
                    <button class="btn">Blogs</button>
                    <button class="btn">Contact Us</button>
            </div>
            <div class="last-part">
                <button>Get Started</button>
            </div>
        </div>
        <div class="main-context">
            <div class="head-text">
                <h1>Insights & Blogs</h1>
            </div>
            <div class="body-text-btn">
                <button class="btn1 clr">All</button>
                <button class="btn2">Tech</button>
                <button class="btn3">SaaS</button>
                <button class="btn4">Marketing</button>
            </div>
            <div class="b-cards">
                <div class="card01">
                    <div class="c1-img">
                        <img 
                        src="Card 1.png" 
                        alt="img 01">
                    </div>
                    <div class="c1-details">
                        <button>Tech</button>
                        <h1>The ultimate guide to<br> saaS markating</h1>
                        <p>may 23,2025</p>
                    </div>
                </div>
                <div class="card02">
                    <div class="c2-img">
                        <img
                         src="Card 2.png"
                         alt="img 02">
                    </div>
                    <div class="c2-details">
                        <button>SaaS</button>
                        <h1>5 Key Trend in SaaS<br> Growth For 2025</h1>
                        <p>may 23,2025</p>
                    </div>
                </div>
                <div class="card03">
                    <div class="c3-img">
                        <img
                         src="Card 3.png"
                         alt="img 03">
                    </div>
                    <div class="c3-details">
                        <button>Marketing</button>
                        <h1>How data-driven<br> property strategies are important</h1>
                        <p>may 23,2025</p>
                    </div>
                </div>
            </div>
            

        </div>
    </div>
</body>
</html>
